<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bid Response | Tevis Engineering Solutions</title>
  <meta name="description" content="Bid response document, rendered from the admin console for printing to PDF.">
  <meta name="author" content="Tyler Tevis, Tevis Engineering Solutions">
  <!-- Staff-only: behind Cloudflare Access with the rest of /admin/. The page itself comes
       from /portal-api/admin/bids/:id/document?format=html, which checks Access itself and
       is the same HTML the Worker prints to PDF (src/bid_html.js in tes-portal), so what
       you see here is what the PDF says. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon.png?v=2">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    /* The page around the sheet. The sheet's own look (the house format) arrives with it
       from the Worker, so the screen, the print and the PDF share one stylesheet. */
    :root { --navy:#1F3864; --muted:#5b6470; }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; background:#e9ecef; color:#1b1f24; }
    body { font-family:Helvetica, Arial, sans-serif; }
    .tools { max-width:8.5in; margin:0 auto; padding:0.6rem 1rem; display:flex; gap:0.5rem; justify-content:flex-end; align-items:center; flex-wrap:wrap; }
    .tools p { margin:0 auto 0 0; font-size:0.8rem; color:var(--muted); }
    .tools button { font:inherit; font-size:0.85rem; font-weight:700; padding:0.55rem 1rem; border-radius:6px; border:1px solid var(--navy); background:var(--navy); color:#fff; cursor:pointer; min-height:44px; }
    .tools button.alt { background:#fff; color:var(--navy); }
    .tools button:disabled { opacity:0.6; cursor:default; }
    .msg { max-width:8.5in; margin:0 auto 0.6rem; padding:0.5rem 0.8rem; background:#fde8e8; border-left:3px solid #a33; font-size:0.85rem; }
    .ver { max-width:8.5in; margin:0 auto 0.6rem; padding:0.5rem 0.8rem; background:#E8EDF5; border-left:3px solid var(--navy); font-size:0.85rem; }
    .sheet { max-width:8.5in; margin:0 auto 2rem; padding:0.75in; box-shadow:0 1px 4px rgba(0,0,0,0.12); }
    .state { max-width:8.5in; margin:3rem auto; text-align:center; color:var(--muted); font-size:1rem; padding:0 1rem; }
    @media (max-width:640px) {
      .sheet { padding:1.1rem 1rem; overflow-x:auto; }
      .sheet .sig { grid-template-columns:1fr; }
    }
    @media print {
      html, body { background:#fff; }
      .tools, .ver, .msg { display:none; }
      .sheet { box-shadow:none; margin:0; padding:0; max-width:none; }
      @page { size:letter; margin:0.6in 0.65in; }
    }
  </style>
  <style id="sheetCss"></style>
</head>
<body>
  <div class="tools" id="tools" hidden>
    <p id="toolsNote">Print or download the PDF, then keep it on the bid as <b>Our response</b>.</p>
    <button type="button" class="alt" id="backBtn">Back to the bid</button>
    <button type="button" class="alt" id="pdfBtn">Download PDF</button>
    <button type="button" id="printBtn">Print</button>
  </div>
  <div class="msg" id="msg" hidden></div>
  <div class="ver" id="ver" hidden></div>
  <div class="state" id="state">Loading&hellip;</div>
  <main class="sheet" id="sheet" hidden></main>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var id = Number(qs.get('id'));
      var ver = Number(qs.get('version')) || null;
      var stateEl = document.getElementById('state');
      var msg = document.getElementById('msg');
      if (!id) { stateEl.textContent = 'No bid was named. Open this from a bid in the admin console.'; return; }
      var base = '/portal-api/admin/bids/' + id;
      document.getElementById('backBtn').addEventListener('click', function () { location.href = './#b=' + id; });
      document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
      // The PDF Cloudflare prints from this same HTML. When PDFs are not set up on the
      // Worker, the reason shows here and Print still works.
      var pdfBtn = document.getElementById('pdfBtn');
      pdfBtn.addEventListener('click', function () {
        pdfBtn.disabled = true; pdfBtn.textContent = 'Making the PDF…'; msg.hidden = true;
        fetch(base + '/pdf' + (ver ? '?version=' + ver : ''), { credentials: 'same-origin' }).then(function (r) {
          var type = r.headers.get('content-type') || '';
          if (r.ok && /pdf/.test(type)) {
            var name = (/filename="([^"]+)"/.exec(r.headers.get('content-disposition') || '') || [])[1] || 'response.pdf';
            return r.blob().then(function (b) {
              var a = document.createElement('a');
              a.href = URL.createObjectURL(b); a.download = name;
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
            });
          }
          return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(j.message || 'The PDF could not be made. Use Print instead.'); });
        }).catch(function (e) { msg.textContent = e.message; msg.hidden = false; })
          .then(function () { pdfBtn.disabled = false; pdfBtn.textContent = 'Download PDF'; });
      });

      fetch(base + '/document?format=html' + (ver ? '&version=' + ver : ''), { credentials: 'same-origin' }).then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error('Your sign-in expired. Open the admin console and sign in, then try again.');
        if (r.status === 404) throw new Error(ver ? 'That version is not on this bid.' : 'That bid does not exist.');
        // A server error can come back as a page, not JSON: say so in words.
        return r.json().catch(function () { throw new Error('The server had a problem (' + r.status + '). Reload in a moment.'); });
      }).then(function (res) {
        if (!res.ok) throw new Error(res.message || 'Could not build the document.');
        document.title = res.title;
        // The Worker escaped everything a person or a model wrote; this is its own markup.
        document.getElementById('sheetCss').textContent = res.css;
        var sheet = document.getElementById('sheet');
        sheet.innerHTML = res.html;
        // The masthead falls back to the square mark if the lockup is missing.
        var logo = sheet.querySelector('.mast img');
        if (logo) logo.addEventListener('error', function () { this.src = '../assets/logo-mark.png'; this.style.width = '0.9in'; });
        if (res.version) {
          var vb = document.getElementById('ver');
          vb.textContent = 'Version ' + res.version.n + ': ' + (res.version.label || '') + (res.version.submitted ? ' (what was submitted)' : '') + '. The wording and prices are as they were then.';
          vb.hidden = false;
        }
        stateEl.hidden = true;
        sheet.hidden = false;
        document.getElementById('tools').hidden = false;
      }).catch(function (e) { stateEl.textContent = e.message || 'Could not load the document.'; });
    })();
  </script>
</body>
</html>
